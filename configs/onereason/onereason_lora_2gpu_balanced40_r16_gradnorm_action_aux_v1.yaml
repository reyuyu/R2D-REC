### model
model_name_or_path: /data/models/onereason-8b-pretrain-competition
trust_remote_code: true
flash_attn: fa2

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05

### dataset
dataset: onereason_material_cot_train98,onereason_material_nocot_train98,onereason_user_action_nocot_train98,onereason_user_chain_cot_train98,onereason_user_chain_nocot_train98,onereason_recommendation_cot_train98,onereason_world_cot_train98,onereason_world_nocot_train98
template: qwen3_nothink
cutoff_len: 8192
packing: false
neat_packing: false
preprocessing_num_workers: 16
overwrite_cache: false
multitask_macro_training: true
multitask_train_dataset_suffix: _train98
multitask_monitoring: true
multitask_global_microbatch_ddp: true
multitask_supercycle_mode: balanced_40
# Required by the generic macro-mode validator; balanced_40 supplies the actual per-step allocation.
multitask_microbatch_allocation:
  material: 2
  user: 2
  recommendation: 3
  world: 1

### experiment A: lagged GradNorm-lite and gradient conflict monitoring
multitask_gradient_control_enabled: true
multitask_gradient_monitor_enabled: true
multitask_gradnorm_enabled: true
multitask_gradnorm_tasks:
  - material
  - user
  - recommendation
multitask_world_loss_weight: 1.0
multitask_gradnorm_warmup_steps: 200
multitask_gradnorm_update_interval: 10
multitask_gradnorm_alpha: 0.5
multitask_gradnorm_update_rate: 0.10
multitask_gradnorm_loss_ema_beta: 0.90
multitask_gradnorm_grad_ema_beta: 0.90
multitask_gradnorm_weight_min: 0.5
multitask_gradnorm_weight_max: 2.0
multitask_gradnorm_step_ratio_min: 0.9
multitask_gradnorm_step_ratio_max: 1.1
multitask_grad_reference_last_n_layers: 4
multitask_grad_reference_modules:
  - q_proj
  - v_proj
  - o_proj
  - down_proj
multitask_grad_reference_lora_matrix: B

### experiment C: Action Select history and length auxiliary v1
user_action_aux_enabled: true
user_action_history_trie_enabled: true
user_action_history_trie_weight: 0.06
user_action_length_guard_enabled: true
user_action_continue_domain_extra: 0.75
user_action_continue_separator_extra: 0.20
user_action_no_early_stop_weight: 0.02
user_action_stop_domain_weight: 0.05
user_action_stop_tail_extra: 1.0
user_action_max_stop_tail_positions: 4
user_action_aux_cap_ratio: 0.08
user_action_aux_warmup_steps: 100

### output
output_dir: /data/outputs/onereason_lora_2gpu_balanced40_r16_gradnorm_action_aux_v1_lr2e4_len8k
logging_steps: 10
save_steps: 500
save_total_limit: 4
overwrite_output_dir: false

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 2.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.03
max_grad_norm: 1.0
max_steps: 5200
bf16: true
seed: 42
