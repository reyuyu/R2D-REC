### model
model_name_or_path: /data/models/onereason-8b-pretrain-competition
trust_remote_code: true
flash_attn: fa2

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05

### dataset
dataset: onereason_material_cot_train98,onereason_material_nocot_train98,onereason_user_action_nocot_train98,onereason_user_chain_cot_train98,onereason_user_chain_nocot_train98,onereason_recommendation_cot_train98,onereason_world_cot_train98,onereason_world_nocot_train98
template: qwen3_nothink
cutoff_len: 8192
packing: false
neat_packing: false
preprocessing_num_workers: 16
overwrite_cache: false
multitask_macro_training: true
multitask_train_dataset_suffix: _train98
multitask_monitoring: true
multitask_global_microbatch_ddp: true
multitask_supercycle_mode: balanced_40
multitask_microbatch_allocation:
  material: 2
  user: 2
  recommendation: 3
  world: 1

### output
output_dir: /data/outputs/onereason_lora_2gpu_balanced40_r64_lr2e4_len8k
logging_steps: 10
save_steps: 500
save_total_limit: 4
overwrite_output_dir: false

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 2.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.03
max_grad_norm: 1.0
max_steps: 5200
bf16: true
seed: 42
